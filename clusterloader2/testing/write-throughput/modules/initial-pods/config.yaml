## Input params
# Valid actions: "create", "delete"
{{$action := .action}}
{{$podCount := DefaultParam .podCount 10000}}
{{$podSize := DefaultParam .podSize (DefaultParam .CL2_POD_SIZE "10KB")}}
{{$podTemplate := DefaultParam .podTemplate ""}}
{{if eq $podTemplate ""}}
  {{if or (eq $podSize "30KB") (eq $podSize "30")}}
    {{$podTemplate = "modules/initial-pods/pod_30KB.yaml"}}
  {{else}}
    {{$podTemplate = "modules/initial-pods/pod_10KB.yaml"}}
  {{end}}
{{end}}
{{$replicas := 0}}
{{if eq $action "create"}}
{{$replicas = $podCount}}
{{end}}


steps:
- name: {{$action}} baseline realistic target pods
  phases:
  - namespaceRange:
      min: 1
      max: 1
    tuningSet: Sequence
    replicasPerNamespace: {{$replicas}}
    objectBundle:
    - basename: bench-pod
      objectTemplatePath: {{$podTemplate}}
